name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rodar testes unitários
        run: python -m unittest discover -s tests -v

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checar sintaxe
        run: python -m py_compile main.py wsl_manager.py gui.py

      - name: Instalar dependências
        run: pip install -r requirements.txt pyinstaller

      - name: Gerar executável
        run: pyinstaller --onedir --windowed --name wslView --icon assets/icon.ico --add-data "assets;assets" --collect-data customtkinter main.py

      - uses: actions/upload-artifact@v4
        with:
          name: wslView-windows
          path: dist/wslView/
